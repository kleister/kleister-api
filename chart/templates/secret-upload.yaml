{{- if and (not .Values.config.upload.existingSecret) (eq .Values.config.upload.driver "s3") }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "kleister-api.fullname" . }}-upload
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kleister-api.labels" . | nindent 4 }}

type: Opaque
data:
  {{- $secretName := printf "%s-upload" (include "kleister-api.fullname" .) }}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $accessValue := (get $secretData .Values.config.upload.accessKey) | default "" }}
  {{- $secretValue := (get $secretData .Values.config.upload.secretKey) | default "" }}
  {{ .Values.config.upload.accessKey }}: {{ if .Values.config.upload.accessKey }}{{ .Values.config.upload.accessKey | b64enc }}{{ else }}{{ $accessValue }}{{ end }}
  {{ .Values.config.upload.secretKey }}: {{ if .Values.config.upload.secretKey }}{{ .Values.config.upload.secretKey | b64enc }}{{ else }}{{ $secretValue }}{{ end }}
{{- end }}
