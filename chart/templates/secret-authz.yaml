{{- if and (not .Values.config.authz.existingSecret) (ne .Values.config.authz.driver "sqlite3") }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "kleister-api.fullname" . }}-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kleister-api.labels" . | nindent 4 }}

type: Opaque
data:
  {{- $secretName := printf "%s-authz" (include "kleister-api.fullname" .) }}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
{{- if eq .Values.config.authz.driver "external" }}
  {{- $tokenValue := (get $secretData .Values.config.authz.tokenKey) | default "" }}
  {{ .Values.config.authz.tokenKey }}: {{ if .Values.config.authz.token }}{{ .Values.config.authz.token | b64enc }}{{ else }}{{ $tokenValue }}{{ end }}
{{- else }}
  {{- $passwordValue := (get $secretData .Values.config.authz.passwordKey) | default "" }}
  {{ .Values.config.authz.passwordKey }}: {{ if .Values.config.authz.password }}{{ .Values.config.authz.password | b64enc }}{{ else }}{{ $passwordValue }}{{ end }}
{{- end }}
{{- end }}
