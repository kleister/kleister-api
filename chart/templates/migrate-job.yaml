apiVersion: batch/v1
kind: Job

metadata:
  name: {{ include "kleister-api.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kleister-api.migrate.labels" . | nindent 4 }}
{{- if .Values.migrate.labels }}
    {{- toYaml .Values.migrate.labels | nindent 4 }}
{{- end }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
{{- if .Values.migrate.annotations }}
    {{- toYaml .Values.migrate.annotations | nindent 4 }}
{{- end }}

spec:
  backoffLimit: 5

  template:
    metadata:
      labels:
        {{- include "kleister-api.migrate.labels" . | nindent 8 }}

    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ template "kleister-api.serviceAccountName" . }}
      {{- if .Values.pullSecrets }}

      imagePullSecrets:
      {{- range .Values.pullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- with .Values.migrate.securityContext }}

      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: kleister-api
          image: {{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          {{- with .Values.migrate.podSecurityContext }}

          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          args:
            - database
            - migrate

          env:
            {{- include "kleister-api.migrate.environment" . | nindent 12 }}
          {{- if .Values.migrate.resources }}

          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          {{- end }}

...
