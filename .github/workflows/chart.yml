---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: chart

"on":
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Ghcr login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.0.0-$(date -u +%Y%m%d%H%M%S).${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Package chart
        run: |
          helm package chart --version "${{ steps.version.outputs.version }}" --app-version "${{ steps.version.outputs.version }}" --destination .

      - name: Publish chart
        if: github.event_name != 'pull_request'
        run: |
          helm push kleister-api-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/kleister/charts

...
